[project]
name = "vector-rag"
version = "0.1.0"
description = "A production-grade terminal vector RAG application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pypdf>=4.0.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.4.24,<0.6.0",
    "onnxruntime<=1.20.0",
    "pytest>=7.0.0",
    "accelerate>=0.26.0",
]

[project.scripts]
vector-rag = "vector_rag.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
]

