application:
  name: "vector-rag"
  environment: "development"

storage:
  sqlite_path: "data/app.db"
  chroma_path: "data/chroma"

chunking:
  strategy: "recursive"
  chunk_size: 800
  chunk_overlap: 120

retrieval:
  top_k: 10

reranker:
  top_n: 5
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

embedding:
  model: "BAAI/bge-small-en-v1.5"

generation:
  model: "Qwen/Qwen2.5-0.5B-Instruct"
  temperature: 0.0
  max_tokens: 800

logging:
  level: "INFO"
  file: "logs/vector-rag.log"
